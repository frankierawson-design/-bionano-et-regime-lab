name: Deploy archived release to Pages

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify immutable release source
        run: test "$(git rev-parse HEAD)" = c49dcc7b1a81d42f68364ad8a4a263dbb57aaf25
      - run: npm run check
      - name: Stamp the clean tagged checkout
        run: npm run provenance
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified release
        id: deployment
        uses: actions/deploy-pages@v4
